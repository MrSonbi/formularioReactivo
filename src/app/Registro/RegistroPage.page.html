<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Formulario Reactivo
    </ion-title>
    <ion-toggle slot="end" (ionChange)="toggleDark($event)">Oscuro</ion-toggle>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>
  <!-- Enlace del FormGroup definido en TypeScript -->
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">
      <!-- Campo Nombre -->
      <ion-item>
        <ion-input label="Nombre completo" labelPlacement="floating" type="text" formControlName="nombre"
          [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
        </ion-input>
      </ion-item>
      <!-- Campo Email con teclado específico para móviles -->
      <ion-item>
        <ion-input label="Correo Electrónico" labelPlacement="floating" type="email" inputmode="email"
          formControlName="email" [errorText]="'Introduzca un email válido.'">
        </ion-input>
      </ion-item>
      <!-- Campo Contraseña -->
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password"
          [errorText]="'Mínimo 8 caracteres, letras y números.'">
        </ion-input>
      </ion-item>
      <!-- Campo Calendario -->
      <ion-item>
        <ion-input label="Calendario" labelPlacement="floating" type="date" formControlName="calendario" [min]="hoy"
          errorText="La fecha es obligatoria y no puede ser anterior a hoy.">
        </ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding-top">
      <!-- Botón dinámico que responde al Signal -->
      <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
        <span *@If="!isSubmitting()">Registrarse</span>
        <ion-spinner name="crescent" *@If="isSubmitting()"></ion-spinner>
      </ion-button>
      @if (datosEnviados()) {
      <ion-button expand="block" color="medium" (click)="descargarPdf()">Descargar PDF</ion-button>
      }
    </div>
  </form>
</ion-content>
